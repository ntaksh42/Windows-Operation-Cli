name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    # This crate is Windows-only: every dependency resolves to the Win32 and
    # UI Automation APIs, so a Linux runner cannot build it (windows-future
    # fails on windows_core::imp). Build and test on the platform it targets.
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Check formatting
      run: cargo fmt --all -- --check
    - name: Clippy
      run: cargo clippy --all-targets -- -D warnings
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
